[project]
name = "aura-buddy-server"
version = "0.1.0"
description = "Pipecat + Gemini Live voice companion with per-user memory and Google Search."
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Aura Buddy" },
]
dependencies = [
    "pipecat-ai[google,silero,webrtc]>=0.0.90",
    # daily-python has no Windows wheel — install the Daily extra only on
    # Linux/macOS (CI + Render). Local Windows dev still resolves/tests fine;
    # the Daily code paths are lazy-imported so they're only needed at runtime.
    "pipecat-ai[daily]>=0.0.90 ; sys_platform != 'win32'",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pydantic>=2.9",
]

# This is an application, not a library — uv resolves and installs deps but
# doesn't try to build/install the project itself. Run with `python server.py`.
[tool.uv]
package = false

# Dev/test tooling. Installed by `uv sync` (dev groups are included by default).
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",          # required by FastAPI's TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so tests can `import server, bot, memory, personas`
addopts = "-ra"
